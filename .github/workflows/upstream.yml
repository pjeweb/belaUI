name: Track upstream

on:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Update upstream mirror and tracker
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # Fast-forward only the dedicated upstream mirror.
      issues: write # Maintain one issue for unported upstream commits.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Fast-forward mirror and report unported commits
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const sync = require('./.github/scripts/sync-upstream.cjs');
            await sync({ github, context, core });
